<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình SmartMed - Kết nối thiết bị</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #F0FFFE 0%, #DFF9F8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .config-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 24px 64px rgba(78, 205, 196, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-box {
            width: 80px; height: 80px;
            background: var(--primary);
            color: white;
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 12px 24px rgba(78, 205, 196, 0.3);
        }
        h1 { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; }
        
        .input-group {
            text-align: left;
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-left: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px solid #E0F2F1;
            background: white;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.1);
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(43, 181, 173, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(43, 181, 173, 0.4);
        }
        
        .help-text {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .help-text a { color: var(--primary); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="config-card">
        <div class="logo-box">📡</div>
        <h1>Kết nối thiết bị</h1>
        <p>Vui lòng nhập địa chỉ IP của ESP8266 để bắt đầu quản lý tủ thuốc và camera.</p>
        
        <form action="{{ url_for('save_config') }}" method="POST">
            <div class="input-group">
                <label>Địa chỉ IP ESP8266</label>
                <input type="text" name="esp_ip" placeholder="VD: 192.168.1.15" required autofocus>
            </div>
            
            <button type="submit" class="btn-submit">🚀 Kết nối ngay</button>
        </form>
        
        <div class="help-text">
            Không biết địa chỉ IP? <a href="#">Xem hướng dẫn</a>
        </div>
    </div>

</body>
</html>
